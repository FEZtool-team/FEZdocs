<!doctype html>
<!--
  Open Graph card (1200×630) for docs/public/og/fezdocs.png, in the style of the
  feztool.com cards (FEZhome scripts/og/card.html). Render from the repo root:

  google-chrome --headless --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
    --virtual-time-budget=5000 --screenshot="docs/public/og/fezdocs.png" "file://$PWD/scripts/og/card.html"

  Colors are the fez-* tokens from docs/.vitepress/theme/custom.css (dark theme).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Poppins, sans-serif;
    color: #F8F9FA;
    background: #212529;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgb(255 255 255 / 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / 0.06) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 80% 30%, black 10%, transparent 75%);
  }
  .glow {
    position: absolute; width: 640px; height: 640px; right: -160px; top: -220px; border-radius: 50%;
    filter: blur(40px); background: rgb(248 249 250 / 0.08);
  }
  .content { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; }
  .logo { height: 56px; width: auto; align-self: flex-start; }
  h1 { margin-top: auto; font-size: 76px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  p { margin-top: 20px; font-size: 30px; line-height: 1.35; font-weight: 300; color: #ADB5BD; max-width: 920px; }
  .url { position: absolute; right: 80px; top: 84px; font-size: 22px; color: #6C757D; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="content">
    <img class="logo" src="../../docs/public/fezdocs-logo-light.svg" alt="">
    <h1>Documentation<br>for FEZtool</h1>
    <p>Install guides, API references and worked examples for FEZrs and the FEZfm earthquake monitor.</p>
  </div>
  <span class="url">docs.feztool.com</span>
</body>
</html>
